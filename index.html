<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C1 Writing Book</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f8f2e8 0%, #efe4d3 100%);
      min-height: 100vh;
      color: #2b2b2b;
    }

    .book {
      width: 1200px;
      max-width: 100%;
      min-height: 780px;
      background: #fffdf9;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      overflow: hidden;
      display: flex;
      margin: 0 auto;
    }

    .sidebar {
      width: 290px;
      background: linear-gradient(180deg, #f6e7cf 0%, #ead8be 100%);
      padding: 35px 22px;
      border-right: 1px solid rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .mobile-header {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background: linear-gradient(135deg, #f6e7cf 0%, #ead8be 100%);
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 1100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    .mobile-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 34px;
      color: #a87419;
      font-weight: 700;
    }

    .hamburger {
      width: 50px;
      height: 50px;
      background: white;
      border: none;
      border-radius: 14px;
      font-size: 26px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .title {
      text-align: center;
      margin-bottom: 28px;
    }

    .title h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 48px;
      color: #a87419;
      font-weight: 700;
    }

    .tab {
      padding: 16px 18px;
      border-radius: 18px;
      border: none;
      background: rgba(255,255,255,0.7);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #4a4030;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }

    .tab:hover {
      transform: translateX(5px);
      background: #fff;
    }

    .tab.active {
      background: linear-gradient(135deg, #d29b2d 0%, #b7831f 100%);
      color: white;
      box-shadow: 0 10px 25px rgba(183,131,31,0.35);
    }

    .content {
      flex: 1;
      padding: 45px;
      overflow-y: auto;
      background: linear-gradient(180deg, #fffdf9 0%, #f8f3ea 100%);
    }

    /* ==================== RESPONSIVE ==================== */
    @media (max-width: 900px) {
      .mobile-header {
        display: flex;
      }

      .book {
        flex-direction: column;
        min-height: 100vh;
      }

      .sidebar {
        position: fixed;
        top: 70px;
        left: -320px;
        width: 280px;
        height: calc(100vh - 70px);
        z-index: 1000;
        transition: left 0.4s ease;
        box-shadow: 10px 0 30px rgba(0,0,0,0.2);
        padding-top: 20px;
      }

      .sidebar.open {
        left: 0;
      }

      .content {
        padding: 90px 20px 30px;
        width: 100%;
      }

      .title {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Mobile Header -->
  <div class="mobile-header">
    <div class="mobile-title">✍ Writing</div>
    <button class="hamburger" onclick="toggleMenu()">☰</button>
  </div>

  <div class="book">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="title">
        <h1>✍ Writing</h1>
        <p>C1 EOI Masterbook</p>
      </div>

      <button class="tab active" onclick="openPage('essay', this)">📝 Essay</button>
      <button class="tab" onclick="openPage('report', this)">📊 Report</button>
      <button class="tab" onclick="openPage('article', this)">📰 Article</button>
      <button class="tab" onclick="openPage('email', this)">📩 Email</button>
      <button class="tab" onclick="openPage('complaint', this)">⚠ Complaint</button>
      <button class="tab" onclick="openPage('mediation', this)">🤝 Mediation</button>
    </div>

    <!-- Content -->
    <div class="content">
      <!-- Aquí va todo tu contenido actual (essay, report, etc.) -->
      <!-- ... (mantengo tu contenido igual) ... -->
    </div>
  </div>

  <script>
    function toggleMenu() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    function openPage(pageId, element) {
      // Ocultar todas las páginas
      document.querySelectorAll('.page').forEach(page => {
        page.classList.remove('active');
      });

      // Mostrar la página seleccionada
      const selectedPage = document.getElementById(pageId);
      if (selectedPage) selectedPage.classList.add('active');

      // Actualizar tabs activos
      document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.remove('active');
      });
      element.classList.add('active');

      // Cerrar menú en móvil
      if (window.innerWidth <= 900) {
        document.getElementById('sidebar').classList.remove('open');
      }
    }
  </script>
</body>
</html>
